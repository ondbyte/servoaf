[package]
name = "servoaf"
description = "Servo-based browser with a built-in MCP control server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
servoaf-core = { path = "../servoaf-core" }
