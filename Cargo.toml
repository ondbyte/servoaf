[workspace]
resolver = "2"
members = ["crates/servoaf-core", "crates/servoaf-shell"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/ondbyte/servoaf"
rust-version = "1.88.0"

[workspace.dependencies]
servo = { version = "0.7.0" }
servo-base = { version = "0.7.0" }
base64 = "0.22"
crossbeam-channel = "0.5"
euclid = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
rand = "0.8"
serde_json = "1"
tiny_http = "0.12"
url = "2.5"
winit = "0.30.13"
dpi = "0.1"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
env_logger = "0.11"

[profile.release]
debug = false

# What the prebuilt archives use: like Servo's own `production` builds
# (whole-program LTO, one codegen unit), but optimized for speed, not size.
# Slow to build; use plain --release while developing.
[profile.production]
inherits = "release"
debug-assertions = false
lto = true
codegen-units = 1
opt-level = 3

# Servo 0.7.0 crates with fixes backported from upstream Servo; see vendor/README.md.
[patch.crates-io]
servo-script = { path = "vendor/servo-script" }
