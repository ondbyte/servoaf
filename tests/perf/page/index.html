<!doctype html>
<!-- A stand-in for a heavy single-page app (Instagram-like): a big script
     bundle, constant re-rendering, many timers, failing network retries. It
     reports frame rate, event-loop lag and key timestamps to the test server. -->
<html>
<head>
<meta charset="utf-8">
<title>servoaf responsiveness</title>
<style>
  body { font: 13px sans-serif; margin: 0; }
  #feed { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; }
  .card { border: 1px solid #ccc; border-radius: 6px; padding: 6px; box-shadow: 0 1px 2px #0002; }
  .card b { color: hsl(var(--h), 60%, 40%); }
  input { font-size: 18px; width: 60%; margin: 8px; }
</style>
</head>
<body>
<input id="box" autofocus placeholder="type here">
<div id="feed"></div>
<script src="bundle.js"></script>
<script src="app.js"></script>
</body>
</html>
